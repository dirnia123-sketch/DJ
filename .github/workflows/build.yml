name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Find project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" | head -1)
          echo "Found: $f"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DawEngine-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
